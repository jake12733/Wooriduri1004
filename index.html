
<!DOCTYPE html>
<html lang="ko">
<head>

  <meta property="og:title" content="우리두리사회적협동조합 공식 홈페이지">
  <meta property="og:description" content="사람과 사람을 잇고 배움과 나눔을 실천합니다.">
  <meta property="og:type" content="website">
  <title>우리두리사회적협동조합 공식 홈페이지</title>
  <link rel="icon" type="image/png" href="/assets/aistudio/logo_emblem.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --green: #2D6A4F;
      --green-dark: #1E4835;
      --ivory: #FAF8F5;
      --beige: #F3EFEA;
      --border: #E8E2D9;
      --text: #212529;
      --muted: #6C757D;
      --white: #FFFFFF;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      font-family: 'Noto Sans KR', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      margin: 0;
      background: var(--ivory);
      color: var(--text);
      line-height: 1.7;
    }

    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; }

    h1, h2, h3, .serif {
      font-family: 'Noto Serif KR', serif;
    }

    .topbar {
      padding: 7px 20px;
      background: var(--green-dark);
      color: white;
      text-align: center;
      font-size: 11px;
      letter-spacing: .04em;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(250,248,245,.97);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }

    .nav-wrap {
      max-width: 1200px;
      margin: auto;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 210px;
      color: var(--green);
    }

    .brand img {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }

    .brand-name {
      font-weight: 700;
      font-size: 15px;
      line-height: 1.45;
    }

    .brand-name small {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 400;
      letter-spacing: .05em;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 22px;
    }

    nav button, .mobile-nav button {
      padding: 8px 0;
      border: 0;
      background: none;
      color: #495057;
      font-size: 13px;
      font-weight: 600;
    }

    nav button:hover, nav button.active { color: var(--green); }

    .menu-toggle {
      display: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: white;
      padding: 7px 12px;
    }

    .mobile-nav {
      display: none;
      padding: 10px 24px 20px;
      border-top: 1px solid var(--border);
      background: var(--ivory);
    }

    .mobile-nav.open { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 20px; }
    .mobile-nav button { text-align: left; }

    main { min-height: 60vh; }

    .container {
      width: min(100% - 40px, 1050px);
      margin: auto;
    }

    .hero {
      position: relative;
      overflow: hidden;
      min-height: 490px;
      display: flex;
      align-items: center;
      background: #E9E5DC;
      border-bottom: 1px solid var(--border);
    }

    .hero-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: .32;
    }

    .hero-shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(250,248,245,.98), rgba(250,248,245,.8) 55%, rgba(250,248,245,.18));
    }

    .hero-content {
      position: relative;
      z-index: 1;
      width: min(100% - 40px, 1050px);
      margin: auto;
      padding: 80px 0;
    }

    .eyebrow {
      display: inline-block;
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .12em;
    }

    .hero h1 {
      max-width: 740px;
      margin: 18px 0;
      font-size: clamp(34px, 5vw, 56px);
      line-height: 1.35;
      letter-spacing: -.045em;
    }

    .hero p {
      max-width: 620px;
      color: #555D58;
      font-size: 16px;
      line-height: 1.9;
    }

    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 10px 19px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: white;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      transition: .2s;
    }

    .btn:hover { transform: translateY(-1px); }
    .btn-primary { color: white; background: var(--green); border-color: var(--green); }
    .btn-primary:hover { background: var(--green-dark); }

    .values-strip {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px 42px;
      padding: 22px 20px;
      background: white;
      border-bottom: 1px solid var(--border);
      color: var(--green);
      font-size: 12px;
      font-weight: 600;
    }

    .section { padding: 72px 0; }
    .section-alt { background: #F5F2EB; }
    .section-head { margin-bottom: 28px; }
    .section-head h2 { margin: 7px 0 10px; font-size: clamp(25px, 3vw, 34px); }
    .section-head p { margin: 0; color: var(--muted); font-size: 14px; }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 40px;
    }

    .about-image {
      width: 100%;
      min-height: 280px;
      max-height: 390px;
      object-fit: cover;
      border-radius: 8px;
    }

    .about-copy p { color: #495057; font-size: 14px; line-height: 2; }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .card {
      overflow: hidden;
      background: white;
      border: 1px solid var(--border);
      border-radius: 9px;
      transition: .2s;
    }

    .card:hover { border-color: var(--green); transform: translateY(-3px); }
    .card-image { width: 100%; height: 190px; object-fit: cover; background: var(--beige); }
    .card-body { padding: 22px; }
    .card-body h3 { margin: 6px 0 10px; font-size: 19px; }
    .card-body p { color: var(--muted); font-size: 13px; line-height: 1.8; }
    .card-link { color: var(--green); font-size: 12px; font-weight: 700; }

    .page { padding: 60px 0 90px; }
    .page-heading { padding-bottom: 26px; margin-bottom: 30px; border-bottom: 1px solid var(--border); }
    .breadcrumb { margin-bottom: 12px; color: var(--muted); font-size: 12px; }
    .breadcrumb button { border: 0; padding: 0; background: none; color: inherit; }
    .page-heading h1 { margin: 0; font-size: clamp(30px, 4vw, 40px); letter-spacing: -.03em; }
    .page-heading p { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
    .content-panel { padding: clamp(20px, 4vw, 42px); background: white; border: 1px solid var(--border); border-radius: 10px; }
    .content-panel h2 { font-size: 25px; }
    .content-panel p { font-size: 14px; line-height: 2; color: #495057; }
    .content-panel li { margin: 9px 0; font-size: 14px; color: #495057; }

    .program-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
    .program-tabs button {
      padding: 10px 14px; border: 1px solid var(--border); border-radius: 4px;
      background: white; color: #495057; font-size: 12px; font-weight: 600;
    }
    .program-tabs button.active { background: var(--green); color: white; border-color: var(--green); }

    .notice-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
    .filters { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--beige); border: 1px solid var(--border); border-radius: 5px; }
    .filters button { border: 0; border-radius: 3px; padding: 7px 12px; background: transparent; color: var(--muted); font-size: 12px; }
    .filters button.active { background: white; color: var(--green); font-weight: 700; }
    .search { width: min(100%, 290px); position: relative; }
    .search input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 4px; background: white; font-size: 12px; }

    .list-box { overflow: hidden; border: 1px solid var(--border); border-radius: 9px; background: white; }
    .list-row { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 19px 22px; text-align: left; border: 0; border-bottom: 1px solid var(--border); background: white; }
    .list-row:last-child { border-bottom: 0; }
    .list-row:hover { background: #F9F7F3; }
    .list-row.pinned { background: #FCFAF7; }
    .list-row h3 { margin: 7px 0 0; font-size: 15px; font-family: 'Noto Sans KR', sans-serif; }
    .list-meta { color: var(--muted); font-size: 11px; }
    .tag { display: inline-block; padding: 2px 7px; margin-right: 5px; border-radius: 3px; background: var(--beige); color: var(--green); font-size: 11px; font-weight: 700; }
    .important { background: #FFF4D8; color: #825A00; }
    .detail { padding: clamp(20px, 4vw, 40px); background: white; border: 1px solid var(--border); border-radius: 10px; }
    .detail h2 { margin: 18px 0; font-size: 25px; }
    .detail-content { min-height: 180px; padding: 20px 0; white-space: pre-wrap; font-size: 14px; line-height: 2; }
    .summary-box { padding: 18px; background: #F5F2EB; border: 1px solid var(--border); border-radius: 6px; margin: 22px 0; }
    .detail-actions { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; padding-top: 22px; border-top: 1px solid var(--border); }
    .empty { padding: 45px 20px; text-align: center; color: var(--muted); background: white; border: 1px solid var(--border); border-radius: 9px; font-size: 13px; }

    .activity-card { width: 100%; padding: 22px; margin-bottom: 15px; border: 1px solid var(--border); border-radius: 9px; background: white; text-align: left; }
    .activity-card:hover { border-color: var(--green); }
    .activity-card h3 { margin: 10px 0; font-size: 18px; }
    .activity-card p { margin: 0; color: #495057; font-size: 13px; }
    .activity-details { padding: 15px; margin: 10px 0; border: 1px solid var(--border); background: var(--ivory); border-radius: 4px; font-size: 13px; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    .field label { font-size: 12px; font-weight: 700; color: #495057; }
    .field input, .field textarea, .field select { width: 100%; padding: 11px; border: 1px solid var(--border); border-radius: 4px; background: white; font-size: 13px; }
    .field textarea { min-height: 150px; resize: vertical; }
    .consent { display: flex; align-items: flex-start; gap: 9px; font-size: 12px; color: #495057; }
    .form-note { font-size: 12px; color: var(--muted); }

    footer { background: #25372F; color: #E9EEE9; padding: 48px 0 24px; }
    .footer-grid { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 30px; }
    footer h3 { margin-top: 0; color: white; font-size: 17px; }
    footer p, footer button { color: #D0D8D1; font-size: 12px; line-height: 1.9; }
    footer button { display: block; border: 0; background: none; padding: 3px 0; text-align: left; }
    footer button:hover { color: white; text-decoration: underline; }
    .copyright { margin-top: 30px; padding-top: 18px; border-top: 1px solid #496055; color: #B9C6BC; font-size: 11px; }

    .modal-backdrop { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 18px; background: rgba(0,0,0,.6); }
    .modal { width: min(100%, 560px); max-height: 90vh; overflow-y: auto; padding: 25px; background: var(--ivory); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 20px 60px #0003; }
    .modal h2 { margin-top: 0; font-size: 21px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    .hidden { display: none !important; }

    @media (max-width: 900px) {
      nav { gap: 12px; }
      nav button { font-size: 12px; }
      .brand { min-width: auto; }
      .card-grid { gap: 12px; }
      .card-body { padding: 16px; }
    }

    @media (max-width: 720px) {
      .nav-wrap { padding: 12px 18px; }
      nav { display: none; }
      .menu-toggle { display: block; }
      .hero { min-height: 430px; }
      .hero-content { padding: 65px 0; }
      .hero p { font-size: 14px; }
      .about-grid, .card-grid, .footer-grid { grid-template-columns: 1fr; }
      .card-image { height: 220px; }
      .section { padding: 52px 0; }
      .page { padding: 40px 0 60px; }
      .container { width: min(100% - 32px, 1050px); }
      .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .list-row { padding: 16px; }
      .list-row h3 { font-size: 14px; }
      .list-row .list-meta:last-child { display: none; }
      .values-strip { gap: 10px 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>

      ).slice().sort((a,b)=>Number(!!b.isPinned)-Number(!!a.isPinned));
      const root = document.getElementById('noticeResults');
      if (root) root.innerHTML = noticeRows(filtered);
    }

    function openNotice(id) {
      const notice = notices.find(n=>n.id===id);
      if (!notice) return;
      notice.views = (notice.views||0)+1;
      saveNotices();
      selectedNoticeId=id;
      render();
      window.scrollTo({top:0,behavior:'smooth'});
    }

    function renderActivities() {
      const selected = activities.find(a=>a.id===selectedActivityId);
      if (selected) {
        return `<section class="page"><div class="container">
          ${pageHeader('활동 소식', '지역사회 네트워크 구축, 공간 나눔, 주민 참여 프로그램 운영 등 우리두리의 실천 기록입니다.')}
          <article class="detail">
            <button class="btn" onclick="selectedActivityId=null;render()">← 활동 목록으로 돌아가기</button>
            <div class="list-meta" style="margin-top:24px"><span class="tag">${escapeHTML(selected.category)}</span> · ${escapeHTML(selected.date)} · ${escapeHTML(selected.location)}</div>
            <h2>${escapeHTML(selected.title)}</h2>
            <div class="summary-box"><strong style="color:var(--green)">활동 개요</strong><p>${escapeHTML(selected.summary)}</p></div>
            <h3>세부 진행 내용 및 기록</h3>
            ${(selected.details||[]).map(d=>`<div class="activity-details">✓　${escapeHTML(d)}</div>`).join('')}
            ${selected.keyOutcomes?.length?`<h3>주요 성과 및 향후 과제</h3><p>${selected.keyOutcomes.map(escapeHTML).join(' · ')}</p>`:''}
            <div class="detail-actions">
              <button class="btn" onclick="selectedActivityId=null;render()">목록으로</button>
              <button class="btn btn-primary" onclick="navigate('contact')">프로그램 및 협력 문의</button>
            </div>
          </article>
        </div></section>`;
      }

      return `<section class="page"><div class="container">
        ${pageHeader('활동 소식', '지역사회 네트워크 구축, 공간 나눔, 주민 참여 프로그램 운영 등 우리두리의 실천 기록입니다.')}
        ${activities.length ? activities.map(a=>`
          <button class="activity-card" onclick="openActivity('${a.id}')">
            <div class="list-meta"><span class="tag">${escapeHTML(a.category)}</span> · ${escapeHTML(a.date)} · ${escapeHTML(a.location)}</div>
            <h3>${escapeHTML(a.title)}</h3>
            <p>${escapeHTML(a.summary)}</p>
            <div class="card-link" style="margin-top:12px">자세히 보기 →</div>
          </button>`).join('') : '<div class="empty">등록된 활동 소식이 없습니다.</div>'}
        <div class="summary-box" style="text-align:center">
          <strong>우리두리사회적협동조합의 활동은 사실에 기초하여 투명하게 기록됩니다.</strong>
          <p>확인되지 않은 협약 및 성과는 임의로 기재하지 않으며, 추진되는 사업 현황은 지속적으로 업데이트됩니다.</p>
        </div>
      </div></section>`;
    }

    function openActivity(id) {
      selectedActivityId = id;
      navigateWithoutReset('activities');
    }

    function navigateWithoutReset(page) {
      currentPage = page;
      if (location.hash !== '#'+page) history.pushState({page},'', '#'+page);
      render();
      window.scrollTo({top:0,behavior:'smooth'});
    }

    function renderContact() {
      return `<section class="page"><div class="container">
        ${pageHeader('온라인 문의', '프로그램 참여와 협력 관련 문의를 남겨주세요.')}
        <div class="content-panel">
          <h2>문의하기</h2>
          <p>작성해 주신 문의 내용을 확인하고 안내해 드리겠습니다. 이 단일 HTML 버전은 브라우저에 문의 내용을 저장하며, 이메일이나 서버로 자동 전송하지 않습니다.</p>
          <form id="contactForm" class="form-grid">
            <div class="field"><label for="contactName">성함 *</label><input id="contactName" name="name" required></div>
            <div class="field"><label for="contactPhone">연락처 *</label><input id="contactPhone" name="phone" required placeholder="연락 가능한 전화번호"></div>
            <div class="field"><label for="contactEmail">이메일</label><input id="contactEmail" name="email" type="email"></div>
            <div class="field"><label for="contactOrg">소속 기관</label><input id="contactOrg" name="organization"></div>
            <div class="field full"><label for="programInterest">관심 사업</label>
              <select id="programInterest" name="programInterest">
                <option value="">선택해 주세요</option>
                <option>미술치료</option><option>경기공유학교</option><option>경기여성거버넌스</option><option>기타 문의</option>
              </select>
            </div>
            <div class="field full"><label for="contactTitle">문의 제목 *</label><input id="contactTitle" name="title" required></div>
            <div class="field full"><label for="contactMessage">문의 내용 *</label><textarea id="contactMessage" name="message" required></textarea></div>
            <div class="field full">
              <label class="consent"><input type="checkbox" id="agreePrivacy" required> 개인정보 수집 및 이용에 동의합니다. 이름과 연락처 등 문의 처리에 필요한 정보를 이 브라우저에 저장합니다. *</label>
              <p class="form-note">개인정보를 입력한 경우 공유 컴퓨터에서는 사용 후 저장된 문의 내역을 확인해 주세요.</p>
            </div>
            <div class="field full"><button class="btn btn-primary" type="submit">문의 내용 저장하기</button></div>
          </form>
          <div id="contactReceipt" class="summary-box hidden"></div>
        </div>
      </div></section>`;
    }

    function render() {
      document.querySelectorAll('#desktopNav button').forEach(b => b.classList.toggle('active', b.dataset.page===currentPage || (currentPage.startsWith('program-')&&b.dataset.page==='program-art-therapy')));
      const app = document.getElementById('app');
      if (currentPage==='home') app.innerHTML=renderHome();
      else if (currentPage==='about-greeting') app.innerHTML=renderGreeting();
      else if (currentPage==='about-mission') app.innerHTML=renderMission();
      else if (PROGRAMS[currentPage]) app.innerHTML=renderProgram();
      else if (currentPage==='notices') app.innerHTML=renderNotices();
      else if (currentPage==='activities') app.innerHTML=renderActivities();
      else if (currentPage==='contact') app.innerHTML=renderContact();
      else { currentPage='home'; app.innerHTML=renderHome(); }
      if (currentPage==='contact') attachContactForm();
    }

    function saveNotices() {
      try { localStorage.setItem('wooridoori_notices', JSON.stringify(notices)); }
      catch(e) { console.error('공지사항 저장 실패',e); }
    }

    function saveActivities() {
      try { localStorage.setItem('wooridoori_activities', JSON.stringify(activities)); }
      catch(e) { console.error('활동 소식 저장 실패',e); }
    }

    function attachContactForm() {
      const form = document.getElementById('contactForm');
      if (!form) return;
      form.addEventListener('submit', e => {
        e.preventDefault();
        const fd = new FormData(form);
        const name = String(fd.get('name')||'').trim();
        const phone = String(fd.get('phone')||'').trim();
        const title = String(fd.get('title')||'').trim();
        const message = String(fd.get('message')||'').trim();
        if (!name||!phone||!title||!message||!document.getElementById('agreePrivacy').checked) {
          alert('필수 항목을 확인해 주세요.');
          return;
        }
        const record = {
          id: 'WD-'+Date.now(),
          name, phone, email: String(fd.get('email')||''),
          organization: String(fd.get('organization')||''),
          programInterest: String(fd.get('programInterest')||''),
          title, message, agreedPrivacy: true,
          createdAt: new Date().toLocaleString('ko-KR'),
          status: '접수완료'
        };
        try {
          const all = readStore('wooridoori_inquiries', []);
          all.unshift(record);
          localStorage.setItem('wooridoori_inquiries', JSON.stringify(all));
          form.classList.add('hidden');
          const receipt = document.getElementById('contactReceipt');
          receipt.classList.remove('hidden');
          receipt.innerHTML = `<strong>문의 내용이 이 브라우저에 저장되었습니다.</strong><p>접수번호: ${escapeHTML(record.id)}</p><p>서버나 이메일로 전송된 것은 아닙니다. 담당자에게 전달하려면 별도의 전송 기능이 필요합니다.</p><button type="button" class="btn" onclick="resetContactForm()">새 문의 작성</button>`;
        } catch(err) {
          alert('브라우저 저장에 실패했습니다. 저장 공간이나 브라우저 설정을 확인해 주세요.');
        }
      });
    }

    function resetContactForm() { render(); }

    function openAddNotice() {
      document.getElementById('modalRoot').innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
          <div class="modal">
            <h2>새 공지사항 등록</h2>
            <p class="form-note">이 버전에는 별도의 관리자 로그인 기능이 없습니다. 등록 내용은 현재 브라우저에 저장됩니다.</p>
            <form id="addNoticeForm">
              <div class="field"><label>분류</label><select name="category"><option>공지</option><option>안내</option><option>모집</option><option>소식</option></select></div>
              <div class="field" style="margin-top:12px"><label>제목</label><input name="title" required></div>
              <div class="field" style="margin-top:12px"><label>작성자</label><input name="author" value="사무국"></div>
              <div class="field" style="margin-top:12px"><label>내용</label><textarea name="content" required></textarea></div>
              <label class="consent" style="margin-top:12px"><input type="checkbox" name="pinned"> 상단 중요 공지로 고정</label>
              <div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">취소</button><button type="submit" class="btn btn-primary">등록하기</button></div>
            </form>
          </div>
        </div>`;
      document.getElementById('addNoticeForm').addEventListener('submit', e => {
        e.preventDefault();
        const fd = new FormData(e.currentTarget);
        notices.unshift({
          id:'notice-'+Date.now(),
          category:String(fd.get('category')),
          title:String(fd.get('title')).trim(),
          author:String(fd.get('author')).trim()||'사무국',
          content:String(fd.get('content')).trim(),
          date:new Date().toISOString().slice(0,10).replace(/-/g,'.'),
          views:0, isPinned:fd.get('pinned')==='on'
        });
        saveNotices();
        closeModal();
        render();
        alert('공지사항이 현재 브라우저에 저장되었습니다.');
      });
    }

    function openPrivacy() {
      document.getElementById('modalRoot').innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
          <div class="modal">
            <h2>개인정보 수집 및 이용 안내</h2>
            <p>문의 처리를 위해 성함, 연락처, 문의 내용 및 선택적으로 이메일과 소속 기관 정보를 입력받습니다.</p>
            <p>이 단일 HTML 버전은 입력 정보를 이용 중인 브라우저의 로컬 저장소에 저장합니다. 서버 전송은 수행하지 않습니다.</p>
            <p>브라우저 데이터 삭제 시 저장된 내용이 사라질 수 있습니다. 실제 운영 전에는 개인정보 처리 목적, 보유 기간, 파기 절차와 접근 권한을 실제 운영 방식에 맞게 확정해야 합니다.</p>
            <div class="modal-actions"><button class="btn btn-primary" onclick="closeModal()">확인</button></div>
          </div>
        </div>`;
    }

    function openAdmin() {
      const records = readStore('wooridoori_inquiries', []);
      document.getElementById('modalRoot').innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
          <div class="modal">
            <h2>문의 접수내역</h2>
            <p class="form-note">브라우저에 저장된 문의만 표시됩니다. 이 기능에는 관리자 인증이 없으므로 실제 개인정보를 다루는 공개 사이트에서는 사용하지 마세요.</p>
            ${records.length ? records.map(r=>`
              <div class="activity-details">
                <strong>${escapeHTML(r.title)}</strong>
                <p>${escapeHTML(r.name)} · ${escapeHTML(r.phone)} · ${escapeHTML(r.createdAt)}</p>
                <p>${escapeHTML(r.message)}</p>
                <span class="list-meta">${escapeHTML(r.programInterest)} · ${escapeHTML(r.status)}</span>
              </div>`).join('') : '<div class="empty">저장된 문의가 없습니다.</div>'}
            <div class="modal-actions">
              <button class="btn" onclick="exportInquiries()">JSON 백업</button>
              <button class="btn btn-primary" onclick="closeModal()">닫기</button>
            </div>
          </div>
        </div>`;
    }

    function exportInquiries() {
      const data = readStore('wooridoori_inquiries', []);
      const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href=url; a.download='wooridoori_inquiries.json'; a.click();
      URL.revokeObjectURL(url);
    }

    function closeModal() { document.getElementById('modalRoot').innerHTML=''; }

    render();
  </script>
</body>
</html>
